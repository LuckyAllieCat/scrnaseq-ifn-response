name: scrnaseq-ifn
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11.18
  - snakemake-minimal=9.27.1
  - scanpy=1.11.5
  - anndata=0.12.19
  - numpy=2.2.6
  - scipy=1.13.1          # scanpy 1.11's Scrublet path breaks on scipy >= 1.14 sparse arrays
  - pandas=2.3.3
  - scikit-learn=1.9.1
  - scikit-image=0.26.0   # used by Scrublet's automatic threshold
  - matplotlib=3.11.2
  - seaborn=0.13.2
  - pydeseq2=0.5.4
  - harmonypy=2.1.0
  - leidenalg=0.12.0
  - python-igraph=1.0.0
  - umap-learn=0.5.12
  - pynndescent=0.7.0
  - pyyaml=6.0.3
  - pytest=9.2.0
